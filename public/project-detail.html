<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TekBot — Projet</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,400;1,700&family=Space+Grotesk:wght@300;400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            'primary': '#c3f5ff', 'primary-container': '#00e5ff', 'secondary': '#f4bb92',
            'secondary-container': '#653d1e', 'tertiary': '#d2f5e0', 'error': '#ffb4ab',
            'background': '#111415', 'surface-container-lowest': '#0c0e10',
            'surface-container-low': '#1a1c1e', 'surface-container': '#1e2022',
            'surface-container-high': '#282a2c', 'surface-container-highest': '#333537',
            'on-surface': '#e0e3e4', 'on-surface-variant': '#bfc8ca',
            'outline': '#849396', 'outline-variant': '#3b494c',
          },
          fontFamily: { serif: ['"Noto Serif"', 'serif'], label: ['"Space Grotesk"', 'sans-serif'], body: ['Inter', 'sans-serif'] },
          borderRadius: { DEFAULT: '0.25rem', lg: '0.5rem', xl: '1rem', full: '9999px' }
        }
      }
    }
  </script>
  <style>
    body { background-color: #111415; font-family: 'Inter', sans-serif; }
    .material-symbols-rounded { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    .blueprint-grid { background-image: radial-gradient(circle, rgba(132,147,150,0.06) 1px, transparent 1px); background-size: 24px 24px; }
    #sidebar { width: 260px; min-height: 100vh; position: sticky; top: 0; }
    @media (max-width: 768px) { #sidebar { display: none; } }
    .task-card { transition: all 0.2s ease; }
    .task-card.active { border-color: rgba(195, 245, 255, 0.3); }
    .connector { width: 2px; height: 24px; background: rgba(59,73,76,0.5); margin: 0 auto; }
    .connector.done { background: rgba(210,245,224,0.4); }
  </style>
</head>
<body class="min-h-screen bg-background text-on-surface flex">

<div id="sidebar" class="bg-surface-container-low border-r border-outline-variant/20 flex-shrink-0"></div>

<div class="flex-1 min-w-0">
  <header class="sticky top-0 z-20 bg-background/90 backdrop-blur-sm border-b border-outline-variant/20 px-6 py-3 flex items-center gap-4">
    <a href="/projects.html" class="text-on-surface-variant hover:text-primary transition-colors">
      <span class="material-symbols-rounded">arrow_back</span>
    </a>
    <div class="flex-1">
      <div class="font-serif font-bold text-on-surface italic" id="project-title">Projet</div>
      <div class="text-on-surface-variant text-xs font-label">[ FEUILLE DE ROUTE ]</div>
    </div>
    <div id="progress-badge" class="bg-surface-container-low border border-outline-variant/20 rounded px-3 py-1.5 flex items-center gap-2">
      <span class="material-symbols-rounded text-secondary text-base">rocket_launch</span>
      <span class="text-xs font-label text-on-surface"><span id="progress-val">0</span>% complété</span>
    </div>
  </header>

  <main class="p-6 blueprint-grid min-h-[calc(100vh-57px)]">
    <div id="loading" class="text-center py-12 text-on-surface-variant">
      <span class="material-symbols-rounded text-5xl animate-spin opacity-40">progress_activity</span>
      <p class="text-sm mt-3 font-label">Chargement du projet...</p>
    </div>
    <div id="content" class="hidden">
      <!-- Project hero -->
      <div class="bg-surface-container-low border border-outline-variant/20 rounded-xl p-6 mb-6">
        <div class="flex flex-col lg:flex-row gap-6">
          <div class="flex-1">
            <div class="flex items-center gap-3 mb-3">
              <span id="status-badge" class="text-xs font-label border rounded px-2 py-0.5"></span>
              <span id="level-req" class="hidden text-xs font-label text-secondary flex items-center gap-1">
                <span class="material-symbols-rounded text-sm">military_tech</span>
                <span id="level-req-val"></span>
              </span>
            </div>
            <p class="text-on-surface-variant text-sm leading-relaxed mb-5" id="project-desc"></p>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
              <div class="bg-surface-container rounded p-3 text-center">
                <div class="font-serif text-xl font-bold text-secondary" id="stat-tasks">0</div>
                <div class="text-xs font-label text-on-surface-variant">Tâches</div>
              </div>
              <div class="bg-surface-container rounded p-3 text-center">
                <div class="font-serif text-xl font-bold text-tertiary" id="stat-done">0</div>
                <div class="text-xs font-label text-on-surface-variant">Complétées</div>
              </div>
              <div class="bg-surface-container rounded p-3 text-center">
                <div class="font-serif text-xl font-bold text-primary" id="stat-members">0</div>
                <div class="text-xs font-label text-on-surface-variant">Membres</div>
              </div>
              <div class="bg-surface-container rounded p-3 text-center">
                <div class="font-serif text-xl font-bold text-secondary" id="stat-xp">0</div>
                <div class="text-xs font-label text-on-surface-variant">XP total</div>
              </div>
            </div>
          </div>

          <div class="lg:w-64 space-y-4">
            <!-- Team -->
            <div>
              <div class="text-xs font-label text-on-surface-variant uppercase tracking-wider mb-2">Équipe</div>
              <div id="team-list" class="space-y-2"></div>
            </div>
            <!-- Required roles -->
            <div>
              <div class="text-xs font-label text-on-surface-variant uppercase tracking-wider mb-2">Postes</div>
              <div id="roles-list" class="space-y-1.5"></div>
            </div>
            <!-- Join button (if not member) -->
            <div id="join-section" class="hidden">
              <button onclick="joinProject()" class="w-full bg-primary-container text-background font-semibold rounded py-2.5 text-sm font-label hover:brightness-110 transition-all flex items-center justify-center gap-2">
                <span class="material-symbols-rounded text-base">group_add</span> Rejoindre ce projet
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Progress bar -->
      <div class="bg-surface-container-low border border-outline-variant/20 rounded-xl p-4 mb-6">
        <div class="flex items-center justify-between mb-2">
          <span class="font-label text-sm text-on-surface">Progression globale</span>
          <span class="text-xs font-label text-on-surface-variant"><span id="tasks-done">0</span>/<span id="tasks-total">0</span> tâches</span>
        </div>
        <div class="h-3 bg-surface-container-high rounded-full overflow-hidden">
          <div class="h-full bg-secondary rounded-full transition-all duration-1000" id="main-progress" style="width: 0%"></div>
        </div>
      </div>

      <!-- Roadmap -->
      <h2 class="font-serif text-xl font-bold text-on-surface italic mb-4">Feuille de Route</h2>
      <div id="tasks-roadmap" class="max-w-2xl"></div>
    </div>
  </main>
</div>

<!-- Task modal -->
<div id="task-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-6 bg-background/80 backdrop-blur-sm">
  <div class="bg-surface-container-low border border-outline-variant/30 rounded-xl p-6 max-w-lg w-full shadow-2xl max-h-[90vh] overflow-y-auto">
    <div class="flex items-start justify-between mb-4">
      <div>
        <h3 class="font-serif font-bold text-on-surface text-xl" id="task-title"></h3>
        <div class="text-xs font-label text-on-surface-variant mt-0.5" id="task-status-label"></div>
      </div>
      <button onclick="closeTask()" class="text-on-surface-variant hover:text-on-surface ml-4">
        <span class="material-symbols-rounded">close</span>
      </button>
    </div>

    <!-- Dialogue -->
    <div class="bg-surface-container border border-outline-variant/20 rounded p-4 mb-4 flex items-start gap-3">
      <div class="text-2xl" id="task-char-emoji">🧪</div>
      <div class="flex-1">
        <div class="text-xs font-label text-on-surface-variant mb-1" id="task-char-name"></div>
        <p class="text-on-surface text-sm leading-relaxed" id="task-dialogue"></p>
      </div>
    </div>

    <p class="text-on-surface-variant text-sm mb-4" id="task-desc"></p>

    <!-- Resources -->
    <div id="task-resources" class="hidden mb-4">
      <div class="text-xs font-label text-on-surface-variant uppercase tracking-wider mb-2">Ressources</div>
      <div id="task-resources-list" class="space-y-2"></div>
    </div>

    <!-- XP -->
    <div class="flex items-center gap-2 text-sm text-secondary font-label mb-5">
      <span class="material-symbols-rounded text-base">stars</span>
      <span id="task-xp">+0 XP</span> en récompense
    </div>

    <!-- Actions -->
    <div id="task-actions" class="space-y-2"></div>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
  loadTheme();

  let projectId = null;
  let projectData = null;
  let currentUser = null;
  let selectedTask = null;

  const STATUS_COLORS = {
    open: 'text-tertiary bg-tertiary/10 border-tertiary/30',
    in_progress: 'text-primary bg-primary/10 border-primary/30',
    completed: 'text-outline bg-outline/10 border-outline/30',
    locked: 'text-error bg-error/10 border-error/30'
  };

  const TASK_STATUS = {
    pending: { icon: 'radio_button_unchecked', color: 'text-outline', label: 'En attente' },
    in_progress: { icon: 'pending', color: 'text-primary', label: 'En cours' },
    completed: { icon: 'check_circle', color: 'text-tertiary', label: 'Complétée' }
  };

  async function init() {
    currentUser = await requireUser();
    if (!currentUser) return;
    initNav('/projects.html', currentUser);

    const params = new URLSearchParams(window.location.search);
    projectId = params.get('id');
    if (!projectId) { window.location.href = '/projects.html'; return; }

    await loadProject();
  }

  async function loadProject() {
    try {
      projectData = await API.get(`/api/projects/${projectId}`);
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('content').classList.remove('hidden');
      renderProject();
    } catch(e) {
      showToast('Projet introuvable', 'error');
      setTimeout(() => window.location.href = '/projects.html', 2000);
    }
  }

  function renderProject() {
    const p = projectData;
    document.title = `TekBot — ${p.title}`;
    document.getElementById('project-title').textContent = p.title;
    document.getElementById('project-desc').textContent = p.description || '';
    document.getElementById('progress-val').textContent = p.progress_percent;
    document.getElementById('stat-tasks').textContent = p.tasks.length;
    document.getElementById('stat-done').textContent = p.completed_tasks;
    document.getElementById('stat-members').textContent = p.members.length;
    document.getElementById('stat-xp').textContent = p.xp_reward;
    document.getElementById('tasks-done').textContent = p.completed_tasks;
    document.getElementById('tasks-total').textContent = p.tasks.length;
    document.getElementById('main-progress').style.width = p.progress_percent + '%';

    const statusCfg = STATUS_COLORS[p.status] || STATUS_COLORS.open;
    const statusLabels = { open: 'Recrutement ouvert', in_progress: 'En cours', completed: 'Terminé', locked: 'Verrouillé' };
    const badge = document.getElementById('status-badge');
    badge.textContent = statusLabels[p.status] || p.status;
    badge.className = `text-xs font-label border rounded px-2 py-0.5 ${statusCfg}`;

    if (p.min_level > 1) {
      document.getElementById('level-req').classList.remove('hidden');
      document.getElementById('level-req-val').textContent = `Niveau ${p.min_level} requis`;
    }

    // Team
    document.getElementById('team-list').innerHTML = p.members.map(m => `
      <div class="flex items-center gap-2">
        <div class="w-7 h-7 rounded-full bg-surface-container-high border border-outline-variant/30 flex items-center justify-center text-xs font-medium text-on-surface-variant">
          ${m.avatar_initial || m.name.charAt(0)}
        </div>
        <div>
          <div class="text-xs text-on-surface">${m.name}</div>
          <div class="text-xs text-on-surface-variant font-label">${SPEC_LABELS[m.specialization] || m.specialization}</div>
        </div>
        ${m.id === currentUser.id ? '<span class="text-xs text-primary font-label">Toi</span>' : ''}
      </div>`).join('') || '<p class="text-xs text-on-surface-variant font-label">Aucun membre</p>';

    // Required roles
    document.getElementById('roles-list').innerHTML = p.required_roles.map(r => {
      const specColor = SPEC_COLORS[r.specialization];
      const isFull = r.filled >= r.count;
      return `<div class="flex items-center justify-between text-xs">
        <div class="flex items-center gap-1.5">
          <span class="material-symbols-rounded text-sm" style="color: ${specColor}">${SPEC_ICONS[r.specialization] || 'person'}</span>
          <span class="text-on-surface-variant">${SPEC_LABELS[r.specialization]}</span>
        </div>
        <span class="font-label ${isFull ? 'text-tertiary' : 'text-on-surface-variant'}">${r.filled}/${r.count}</span>
      </div>`;
    }).join('');

    // Join button
    if (!p.is_member && p.status === 'open') {
      document.getElementById('join-section').classList.remove('hidden');
    }

    // Roadmap
    renderRoadmap();
  }

  function renderRoadmap() {
    const tasks = projectData.tasks;
    const container = document.getElementById('tasks-roadmap');

    container.innerHTML = tasks.map((task, i) => {
      const status = TASK_STATUS[task.status] || TASK_STATUS.pending;
      const isUnlocked = task.is_unlocked;
      const char = CHARACTERS[task.presenter_character] || CHARACTERS.senku;

      return `
        ${i > 0 ? `<div class="connector ${tasks[i-1].status === 'completed' ? 'done' : ''}"></div>` : ''}
        <div class="task-card ${task.status === 'in_progress' ? 'active' : ''} bg-surface-container-low border border-outline-variant/20 rounded-xl p-5 ${isUnlocked ? 'cursor-pointer hover:border-outline/40' : 'opacity-50'} transition-all" ${isUnlocked ? `onclick="openTask(${task.id})"` : ''}>
          <div class="flex items-start gap-4">
            <div class="flex-shrink-0 w-10 h-10 rounded-full bg-surface-container flex items-center justify-center">
              <span class="material-symbols-rounded text-xl ${status.color}">${isUnlocked ? status.icon : 'lock'}</span>
            </div>
            <div class="flex-1 min-w-0">
              <div class="flex items-start justify-between gap-2 mb-1">
                <h4 class="font-medium text-on-surface">${task.title}</h4>
                <div class="flex items-center gap-2 flex-shrink-0">
                  ${task.required_specialization ? `<span class="text-xs font-label" style="color: ${SPEC_COLORS[task.required_specialization]}">${SPEC_LABELS[task.required_specialization]}</span>` : ''}
                  <span class="text-xs font-label ${status.color}">${status.label}</span>
                </div>
              </div>
              <p class="text-on-surface-variant text-sm line-clamp-2 mb-2">${task.description || ''}</p>
              <div class="flex items-center gap-4 text-xs font-label text-on-surface-variant">
                <span class="flex items-center gap-1">${char.emoji} ${char.name}</span>
                <span class="flex items-center gap-1 text-secondary"><span class="material-symbols-rounded text-sm">stars</span>+${task.xp_reward} XP</span>
                ${task.resources?.length > 0 ? `<span class="flex items-center gap-1"><span class="material-symbols-rounded text-sm">attach_file</span>${task.resources.length} ressource${task.resources.length > 1 ? 's' : ''}</span>` : ''}
              </div>
            </div>
          </div>
        </div>`;
    }).join('');
  }

  function openTask(taskId) {
    if (!projectData.is_member) {
      showToast('Rejoignez le projet pour accéder aux tâches', 'error');
      return;
    }
    const task = projectData.tasks.find(t => t.id === taskId);
    if (!task || !task.is_unlocked) return;
    selectedTask = task;

    const char = CHARACTERS[task.presenter_character] || CHARACTERS.senku;
    document.getElementById('task-title').textContent = task.title;
    document.getElementById('task-char-emoji').textContent = char.emoji;
    document.getElementById('task-char-name').textContent = char.name + ' — ' + char.tagline;
    document.getElementById('task-dialogue').textContent = task.dialogue_text || '';
    document.getElementById('task-desc').textContent = task.description || '';
    document.getElementById('task-xp').textContent = `+${task.xp_reward} XP`;

    const statusLabel = TASK_STATUS[task.status];
    document.getElementById('task-status-label').textContent = `[ ${statusLabel?.label?.toUpperCase() || 'EN ATTENTE'} ]`;

    // Resources
    if (task.resources?.length > 0) {
      document.getElementById('task-resources').classList.remove('hidden');
      const typeIcons = { doc: 'description', video: 'play_circle', link: 'open_in_new' };
      document.getElementById('task-resources-list').innerHTML = task.resources.map(r => `
        <a href="${r.url}" target="_blank" class="flex items-center gap-2 bg-surface-container border border-outline-variant/20 rounded p-3 text-sm text-on-surface hover:border-primary/30 transition-all">
          <span class="material-symbols-rounded text-primary text-base">${typeIcons[r.type] || 'link'}</span>
          ${r.title}
          <span class="material-symbols-rounded text-outline text-sm ml-auto">open_in_new</span>
        </a>`).join('');
    } else {
      document.getElementById('task-resources').classList.add('hidden');
    }

    // Actions
    const actions = document.getElementById('task-actions');
    if (task.status === 'completed') {
      actions.innerHTML = `<div class="flex items-center justify-center gap-2 text-tertiary font-label py-3">
        <span class="material-symbols-rounded">verified</span> Tâche complétée !
      </div>`;
    } else if (task.status === 'in_progress') {
      actions.innerHTML = `
        <button onclick="updateTaskStatus(${task.id}, 'completed')" class="w-full bg-tertiary/10 text-tertiary border border-tertiary/30 rounded py-2.5 text-sm font-label hover:bg-tertiary/20 transition-all flex items-center justify-center gap-2">
          <span class="material-symbols-rounded text-base">check_circle</span> Marquer comme terminée (+${task.xp_reward} XP)
        </button>`;
    } else {
      actions.innerHTML = `
        <button onclick="updateTaskStatus(${task.id}, 'in_progress')" class="w-full bg-primary/10 text-primary border border-primary/30 rounded py-2.5 text-sm font-label hover:bg-primary/20 transition-all flex items-center justify-center gap-2">
          <span class="material-symbols-rounded text-base">play_circle</span> Commencer cette tâche
        </button>`;
    }

    document.getElementById('task-modal').classList.remove('hidden');
  }

  function closeTask() {
    document.getElementById('task-modal').classList.add('hidden');
    selectedTask = null;
  }

  async function updateTaskStatus(taskId, status) {
    try {
      const result = await API.post(`/api/projects/${projectId}/tasks/${taskId}/progress`, { status });
      if (result.xp_gained > 0) {
        animateXPGain(result.xp_gained, result.level_up);
        showToast(`+${result.xp_gained} XP gagnés !`, 'xp');
      }
      if (status === 'completed') showToast('Tâche complétée !', 'success');
      closeTask();
      await loadProject();
    } catch(e) { showToast(e.message, 'error'); }
  }

  async function joinProject() {
    try {
      await API.post(`/api/projects/${projectId}/join`);
      showToast('Bienvenue dans le projet !', 'success');
      await loadProject();
    } catch(e) { showToast(e.message, 'error'); }
  }

  document.getElementById('task-modal').addEventListener('click', (e) => {
    if (e.target === document.getElementById('task-modal')) closeTask();
  });

  init();
</script>
</body>
</html>
